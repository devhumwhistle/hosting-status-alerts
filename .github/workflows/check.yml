name: Check status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: Send a test notification
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# One run at a time, so two never commit state.json over each other.
concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH_SERVER: ${{ secrets.WATCH_SERVER }}
          WATCH_SITE: ${{ secrets.WATCH_SITE }}
        run: python3 check.py ${{ inputs.test && '--test' || '' }}

      - name: Save state
        run: |
          git add state.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Update state"
            git push -q
          fi

      # GitHub pauses a public repository's schedule after 60 days without
      # activity. Re-enabling the workflow once a day keeps it running.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gh api --method PUT "repos/${{ github.repository }}/actions/workflows/check.yml/enable" >/dev/null
          fi
